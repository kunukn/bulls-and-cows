name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - run: pnpm build
        env:
          VITE_BASE_PATH: /bulls-and-cows/
          # Mirror of tyrko.app: keep it out of search results.
          VITE_ROBOTS_NOINDEX: "1"
          # No SPA fallback on GitHub Pages: use hash URLs (/#/highscores).
          VITE_USE_HISTORY_ROUTING: "0"
          # The daily code is played on tyrko.app only: each site has its own
          # save, so a second site would be a second attempt (decision 0012).
          VITE_DAILY_URL: https://www.tyrko.app/daily

      # Vercel reads vercel.json from the pushed branch, so main's config can't stop gh-pages builds.
      - name: Disable Vercel builds for the gh-pages branch
        run: |
          echo '{ "git": { "deploymentEnabled": false } }' > dist/vercel.json

      - name: Deploy to gh-pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          npx --yes gh-pages@6 -d dist --nojekyll --message "deploy: $(git log -1 --pretty=%s)"
