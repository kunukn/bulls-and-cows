name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: node-pty stays out of the lockfile
        run: ./scripts/node-pty-absent.sh

      - run: pnpm install --frozen-lockfile

      - name: Lint & type check
        run: pnpm check

      - name: Format check
        run: pnpm format:check

  validate-build:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: checks

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Unit tests
        run: pnpm test:run
